name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check before packaging
        run: node scripts/check-design.mjs assets/system-design.html examples/*/index.html
      - name: Package the skill
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip --prefix=archladder/ -o dist/archladder.zip HEAD
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/archladder.zip --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."
